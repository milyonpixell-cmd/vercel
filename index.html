<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Milyon Pixel - Türkiye'nin Piksel Reklam Duvarı</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(45deg, #ff0055, #00ccff);
      color: white;
      text-align: center;
      min-height: 100vh;
    }

    header {
      padding: 40px 20px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2rem;
      max-width: 800px;
      margin: auto;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(100, 10px);
      grid-template-rows: repeat(100, 10px);
      justify-content: center;
      margin: 40px auto;
      width: 1000px;
      height: 1000px;
      border: 2px solid white;
      background: #111;
    }

    .pixel {
      width: 10px;
      height: 10px;
      background-color: #333;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .pixel:hover {
      background-color: #ffcc00;
    }

    footer {
      margin: 40px 0;
    }

    .btn {
      background-color: #fff;
      color: #000;
      border: none;
      padding: 15px 25px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background-color: #ffcc00;
    }

    @media (max-width: 1100px) {
      .grid {
        transform: scale(0.8);
        transform-origin: top center;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>🎨 Milyon Pixel</h1>
    <p>Türkiye’nin en yaratıcı dijital reklam duvarına hoş geldiniz! Her piksel bir fırsattır. Alanını hemen ayırt!</p>
  </header>

  <div class="grid" id="pixelGrid"></div>

  <footer>
    <p>Reklam vermek için bizimle iletişime geçin:</p>
    <button class="btn" onclick="window.location.href='mailto:milyonpixell@gmail.com'">📧 Reklam Alanı Satın Al</button>
    <p style="margin-top:20px; font-size:0.9rem; opacity:0.8;">© 2025 Milyon Pixel | Tüm Hakları Saklıdır</p>
  </footer>

  <script>
    const grid = document.getElementById('pixelGrid');

    for (let i = 0; i < 10000; i++) {
      const pixel = document.createElement('div');
      pixel.classList.add('pixel');
      pixel.addEventListener('click', () => {
        alert('Bu piksel henüz rezerve edilmedi! Reklam vermek için alttaki butona tıklayın.');
      });
      grid.appendChild(pixel);
    }
  </script>
</body>
</html>
